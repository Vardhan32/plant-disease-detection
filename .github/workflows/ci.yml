name: CI tests (no retraining)

# Fast checks that run on every push and pull request. This workflow never
# trains a model: backend tests load the tracked model artifacts, and the
# frontend job only builds the production bundle.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s backend -p "test_*.py" -t .

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  docker-compose-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and start the full application
        run: docker compose up --build --detach

      - name: Verify backend health and frontend response
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5000/health > /tmp/backend-health.json; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs
              echo "Backend did not become healthy within 5 minutes."
              exit 1
            fi
            sleep 5
          done
          cat /tmp/backend-health.json
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          echo "Backend health endpoint and frontend HTTP response passed."

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
